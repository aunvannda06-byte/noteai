<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Imvannda Workspace</title><link href="https://fonts.googleapis.com/css2?family=Siemreap&display=swap" rel=stylesheet>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#f4f8ff;--c:#fff;--b:#e3ebf6;--t:#1b2a41;--m:#6b7a90;--p:#2563eb;--pl:#e8f0ff}
*{box-sizing:border-box}body{margin:0;font:14px 'Khmer OS Siemreap','Siemreap','Noto Sans Khmer',system-ui,sans-serif;background:var(--bg);color:var(--t);display:flex;height:100vh}

#burger{display:none}main{padding:24px;overflow:auto;flex:1}
h1{margin:0;font-size:22px}.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
button{font:inherit;border:1px solid var(--b);background:var(--c);border-radius:9px;padding:7px 12px;cursor:pointer;color:var(--t)}button:hover{border-color:var(--p)}
button.pr{background:var(--p);color:#fff;border-color:var(--p)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:16px;box-shadow:0 2px 8px #2563eb0d}.card b{font-size:24px;display:block}
.row{display:flex;align-items:center;gap:12px;background:var(--c);border:1px solid var(--b);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.ic{font-size:20px;cursor:pointer}.nm{flex:1;cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis}.nm small{display:block;color:var(--m);font-size:12px}
.acts{display:flex;gap:4px;flex-wrap:wrap}.acts button{padding:4px 8px;font-size:12px}
.empty{padding:32px;text-align:center;color:var(--m);border:1px dashed var(--b);border-radius:12px}
.drop{border:2px dashed #9db8ee;background:var(--pl);border-radius:14px;padding:18px;text-align:center;color:var(--p);margin-bottom:16px;cursor:pointer}.drop.over{background:#d4e3ff}
h3{margin:18px 0 8px}.crumb a{cursor:pointer;color:var(--p)}
#m{position:fixed;inset:0;background:#0b1b3a66;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}#m.on{display:flex}
.md{background:var(--c);border-radius:16px;padding:20px;width:min(720px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.md input,.md select{padding:9px;border:1px solid var(--b);border-radius:8px;font:inherit;width:100%}
#ne{min-height:240px;border:1px solid var(--b);border-radius:8px;padding:12px;outline:none}
.md iframe,.md img,.md video{width:100%;max-height:70vh;border:0;min-height:50vh;object-fit:contain}
@media(max-width:800px){aside{position:fixed;z-index:5;height:100%;transform:translateX(-100%);transition:.2s}aside.on{transform:none}#burger{display:block}main{padding:16px}}
input,select{font:inherit}
.x{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;padding:0;font-size:16px}
.md{position:relative;padding-top:48px;animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.92)}}
.card,.row{transition:.15s}.row:hover,.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px #2563eb1a}
.pill{padding:2px 9px;border-radius:7px;font-size:11px;font-weight:700;background:var(--pl);color:var(--p)}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.tabs button{border-radius:20px;text-transform:capitalize}.tabs .on{background:var(--p);color:#fff;border-color:var(--p)}
.chev{width:26px;height:26px;padding:0;border:0;background:none;color:var(--m);font-size:20px;transition:.2s;flex:none}.chev:hover{color:var(--p)}.chev.o{transform:rotate(90deg);color:var(--p)}
.tree{margin-left:20px;border-left:2px solid var(--pl);padding-left:10px;animation:pop .2s}
.hero{background:linear-gradient(120deg,#2563eb,#60a5fa);color:#fff;border-radius:18px;padding:24px;margin-bottom:18px}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw span{width:34px;height:34px;border-radius:50%;cursor:pointer;box-shadow:0 0 0 1px var(--b);transition:.15s}.sw span:hover{transform:scale(1.12)}.sw span.on{box-shadow:0 0 0 3px var(--p)}
.pv{border-radius:16px;padding:18px;color:#fff;display:flex;gap:14px;align-items:center;box-shadow:0 10px 24px #2563eb40;animation:fl 3s ease-in-out infinite;transition:background .3s}
@keyframes fl{50%{transform:translateY(-4px)}}

::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:linear-gradient(#93c5fd,#3b82f6);border-radius:10px;border:2px solid transparent;background-clip:content-box}::-webkit-scrollbar-thumb:hover{background:#2563eb;background-clip:content-box;border:2px solid transparent}*{scrollbar-width:thin;scrollbar-color:#60a5fa transparent}
aside{transition:margin .25s;flex:none}body.hs aside{margin-left:-240px}#burger{display:block}
@media(max-width:800px){body.hs aside{margin-left:0}}
.nav{display:flex;align-items:center}.nb{margin-left:auto;background:#dc2626;color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:700;animation:bl 1.2s infinite}
.chev{width:30px;height:30px;border-radius:50%;background:var(--pl);color:var(--p);font-size:22px;font-weight:800;line-height:1;display:grid;place-items:center;animation:pl 2s infinite}.chev:hover,.chev.o{background:var(--p);color:#fff}.chev.o{animation:none}
@keyframes pl{0%{box-shadow:0 0 0 0 #2563eb66}70%,100%{box-shadow:0 0 0 9px #2563eb00}}
.tabs{background:var(--pl);padding:5px;border-radius:14px;width:max-content;max-width:100%;overflow-x:auto;flex-wrap:nowrap;gap:4px}.tabs button{border:0;background:none;white-space:nowrap}.tabs .on{box-shadow:0 3px 10px #2563eb55}
.cnt{background:#fff;color:var(--p);border-radius:9px;padding:0 7px;font-size:11px;margin-left:4px}.tabs .on .cnt{background:#ffffff33;color:#fff}
.md.wide{width:min(1280px,98vw);height:94vh;max-height:94vh}.md.wide iframe,.md.wide img,.md.wide video{flex:1;min-height:0;max-height:none;height:100%}#m:has(.wide){padding:8px}
#d{position:fixed;inset:0;background:#0b1b3a88;backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}#d.on{display:flex}
.dg{width:min(440px,100%);padding-top:28px;text-align:center;align-items:stretch}.dgi{width:64px;height:64px;border-radius:20px;background:var(--pl);display:grid;place-items:center;font-size:32px;margin:0 auto;animation:fl 3s ease-in-out infinite}
.fl{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--m);text-align:left}.md textarea{padding:9px;border:1px solid var(--b);border-radius:8px;font:inherit;width:100%;resize:vertical}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button.pr.dn{background:#dc2626;border-color:#dc2626}
.ts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1b2a41;color:#fff;padding:10px 18px;border-radius:12px;z-index:30}
.go{cursor:pointer}
.dsc{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;background:var(--c);border:1px solid var(--b);border-radius:14px;padding:14px;margin-bottom:14px}.dsc p{margin:6px 0 0;white-space:pre-wrap;color:var(--m)}
.wk{display:grid;grid-template-columns:repeat(7,minmax(170px,1fr));gap:10px;overflow-x:auto;padding-bottom:8px}
.day{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:10px;min-height:200px}.day.today{border:2px solid var(--p);background:var(--pl)}.dh{display:flex;gap:6px;align-items:center}.dh small{color:var(--m)}.dh button{margin-left:auto;padding:0 9px}
.ev{display:flex;gap:6px;align-items:flex-start;background:#fff;border:1px solid var(--b);border-left:4px solid var(--p);border-radius:9px;padding:6px 8px;margin-top:6px;font-size:12px}.ev small{display:block;color:var(--m)}.evn{cursor:pointer;flex:1;min-width:0}.t-task{border-left-color:#10b981}.t-meeting{border-left-color:#8b5cf6;background:#f5f0ff}.dn2{opacity:.55;text-decoration:line-through}
.gl{display:flex;align-items:center;gap:8px;padding:6px 0}
.mc .dt{width:54px;height:58px;border-radius:12px;background:var(--pl);color:var(--p);display:grid;place-content:center;text-align:center;flex:none}.dt b{font-size:22px;line-height:1}.dt small{font-size:11px;text-transform:uppercase}
.alr{padding:10px 14px;border-radius:12px;margin-bottom:8px;cursor:pointer}.a1{background:#fff1dc;color:#c2410c;border:1px solid #fdba74}.a2{background:#fee2e2;color:#b91c1c;border:1px solid #fca5a5;animation:bl 1.4s infinite}
@keyframes bl{50%{opacity:.6}}
.u1{background:#fff1dc;color:#c2410c}.u2,.u3{background:#fee2e2;color:#dc2626;animation:bl 1.2s infinite}
#pc{flex:1;min-height:0;overflow:auto;background:#525659;border-radius:8px;display:flex;padding:8px}#pc canvas{margin:auto;display:block;box-shadow:0 2px 12px #0006;background:#fff;flex:none}
.pbar{align-items:center}.pbar input{width:70px!important;text-align:center}
.md:fullscreen{width:100vw;height:100vh;max-height:none;border-radius:0}
.ck{width:18px!important;height:18px;flex:none;cursor:pointer;padding:0!important}.sa{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--c);border:1px solid var(--b);border-radius:12px;padding:10px 14px;margin-bottom:10px}
button:disabled{opacity:.45;cursor:not-allowed}
.r1{border-color:#fdba74;background:#fffaf2}.r2,.r3{border-color:#fca5a5;background:#fff5f5}
</style></head><body>
<aside id=sb><div class=logo style="display:flex;justify-content:space-between;align-items:center">◆ Imvannda</div><div id=nav></div>
<div class=box><b>Storage (this browser)</b><div class=bar><i id=sbar style="width:0"></i></div><span id=stxt>…</span></div>
<div class=box><b>Sync</b><br><span class=dot id=sdot></span><span id=sst></span></div></aside>
<section><div class=top><button id=burger data-a=burger>☰</button><input id=q placeholder="Search files, notes, tasks, projects…"></div><main id=main></main></section>
<div id=m></div><div id=d></div><input type=file id=fi multiple hidden>
<script>
const DB=new Promise((res,rej)=>{const r=indexedDB.open('imvannda',1);r.onupgradeneeded=()=>r.result.createObjectStore('items',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=async(m,f)=>{const d=await DB;return new Promise((res,rej)=>{const t=d.transaction('items',m);const o=f(t.objectStore('items'));t.oncomplete=()=>res(o&&o.result);t.onerror=()=>rej(t.error)})};
let items=[],view={k:'home'},q='',ed=null,url=null;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const save=it=>{it.updated=Date.now();return tx('readwrite',s=>s.put(it)).catch(e=>toast('Save failed: '+e))};
const get=id=>items.find(i=>i.id===id),ord=(a,b)=>(a.order??a.created)-(b.order??b.created),kids=id=>items.filter(i=>i.parent===id&&!i.trashed).sort(ord);
const desc=id=>{let o=[];for(const c of items.filter(i=>i.parent===id))o.push(c,...desc(c.id));return o};
const path=id=>{let p=[],c=get(id);while(c){p.unshift(c);c=get(c.parent)}return p};

const toast=m=>{const e=document.createElement('div');e.className='ts';e.textContent=m;document.body.append(e);setTimeout(()=>e.remove(),3000)};
const dlg=o=>new Promise(r=>{const e=$('#d');e.innerHTML=`<div class="md dg"><button class=x data-d=0 title=Close>✕</button><div class=dgi>${o.icon||'📁'}</div><h2 style="margin:0">${o.title}</h2>${o.msg?`<p style="margin:0;color:var(--m)">${esc(o.msg)}</p>`:''}${o.input!=null?`<label class=fl>${o.label||''}${o.area?`<textarea id=di rows=5 placeholder="${esc(o.ph||'')}">${esc(o.input)}</textarea>`:`<input id=di value="${esc(o.input)}" placeholder="${esc(o.ph||'')}">`}</label>`:''}<div class=acts style="justify-content:flex-end"><button data-d=0>Cancel</button><button class="pr ${o.danger?'dn':''}" data-d=1>${o.ok||'OK'}</button></div></div>`;e.classList.add('on');const i=$('#di');i&&(i.focus(),i.setSelectionRange?.(i.value.length,i.value.length));e.onclick=ev=>{const b=ev.target.closest('[data-d]');if(!b)return;const v=b.dataset.d=='1',val=i?i.value.trim():true;e.classList.remove('on');e.innerHTML='';r(v?(i?(val||(o.empty?'':null)):true):null)};e.onkeydown=ev=>{if(ev.key=='Enter'&&i&&i.tagName=='INPUT')e.querySelector('[data-d="1"]').click()}});
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),TD=()=>iso(new Date()),addD=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return iso(d)},mon=s=>addD(s,-((new Date(s+'T00:00').getDay()+6)%7));
const inRange=(dt,f)=>{const t=TD();if(f=='today')return dt==t;if(f=='week'){const m=mon(t);return dt>=m&&dt<=addD(m,6)}if(f=='month')return dt.slice(0,7)==t.slice(0,7);return true};
const urg=i=>{if(!i.due||i.done)return 0;const t=TD();if(new Date(i.due+'T'+(i.time||'23:59'))<new Date())return 3;return i.due==t?2:i.due==addD(t,1)?1:0};
const murg=i=>{if(i.done)return 0;const t=TD();return i.date==t?2:i.date==addD(t,1)?1:0};
const ur=i=>i.type=='meeting'?murg(i):i.type=='task'?urg(i):0;
const bdg=u=>u?`<span class="pill u${u}">${['','🟠 ស្អែក','🔴 ថ្ងៃនេះ!','⚠ ហួសកំណត់'][u]}</span>`:'';
const WD=['ច័ន្ទ','អង្គារ','ពុធ','ព្រហស្បតិ៍','សុក្រ','សៅរ៍','អាទិត្យ'];
const F=(id,l,v,t='text')=>`<label class=fl>${l}<input id=${id} type=${t} value="${esc(v||'')}"></label>`,TA=(id,l,v)=>`<label class=fl>${l}<textarea id=${id} rows=3>${esc(v||'')}</textarea></label>`;
const mf=(v,m,t=TD())=>v=='past'?m.date<t:m.date>=t&&(v=='up'||inRange(m.date,v));
const alr=only=>{const t=TD(),tm=addD(t,1),L=items.filter(i=>!i.trashed);let h='';if(only!='task')h+=L.filter(i=>i.type=='meeting'&&!i.done&&(i.date==t||i.date==tm)).map(m=>`<div class="alr ${m.date==t?'a2':'a1'}" data-a=nav data-v=meetings><b>${m.date==t?'🔴 ថ្ងៃនេះ':'🟠 ស្អែក'}</b> 👥 ${esc(m.name)} ${m.time?'⏰ '+m.time:''}</div>`).join('');if(only!='meeting')h+=L.filter(i=>i.type=='task'&&urg(i)>=2).map(m=>`<div class="alr a2" data-a=nav data-v=tasks><b>${urg(m)==3?'⚠ ហួសកំណត់':'🔴 ប្រញាប់'}</b> ☑ ${esc(m.name)} ${m.time?'⏰ '+m.time:''}</div>`).join('');return h};
const nb=v=>{const L=items.filter(i=>!i.trashed),t=TD(),tm=addD(t,1),n=v=='meetings'?L.filter(i=>i.type=='meeting'&&!i.done&&(i.date==t||i.date==tm)).length:v=='tasks'?L.filter(i=>i.type=='task'&&urg(i)>=2).length:0;return n?`<span class=nb>${n}</span>`:''};
const dsc=c=>`<div class=dsc><div><b>📝 Description</b><p>${c.desc?esc(c.desc):'<i>No description yet.</i>'}</p></div><button data-a=edesc data-id=${c.id}>✎ ${c.desc?'Edit':'Add'} description</button></div>`;
const ev=i=>`<div class="ev t-${i.type} r${ur(i)} ${i.done?'dn2':''}" data-id=${i.id}><span class=ic data-a=${i.type=='meeting'?'open':'tgl'} style="font-size:15px">${ico(i)}</span><div class=evn data-a=open><b>${esc(i.name)}</b><small>${i.time?'⏰ '+i.time:''}</small></div></div>`;
const mc=i=>{const u=murg(i),d=new Date(i.date+'T00:00');return `<div class="row mc r${u}" data-id=${i.id}><div class=dt><b>${d.getDate()}</b><small>${d.toLocaleString('en',{month:'short'})}</small></div><div class=nm data-a=open><b style="font-size:15px;display:block;${i.done?'text-decoration:line-through':''}">${esc(i.name||'Untitled')} ${bdg(u)}</b><small>⏰ ${i.time||'--:--'}${i.place?' · 📍 '+esc(i.place):''}${i.people?' · 👥 '+esc(i.people):''}</small>${i.agenda?`<small>📋 ${esc(i.agenda.slice(0,90))}</small>`:''}</div><span class=acts><button data-a=tgl title="Mark done">${i.done?'↩':'✔'}</button><button data-a=del>🗑</button></span></div>`};
const isC=i=>i.type==='folder'||i.type==='project',cur=()=>view.k==='folder'?view.id:null;
async function add(type,name,extra={}){const it={id:crypto.randomUUID(),type,name,parent:cur(),created:Date.now(),...extra};items.push(it);await save(it);return it}
const NAV=[['home','🏠 Home'],['notes','📝 Notes'],['tasks','☑ Tasks'],['weekly','🗓 Weekly Plan'],['meetings','👥 Meeting'],['projects','📘 Projects'],['documents','📄 Documents'],['recent','🕘 Recent'],['starred','★ Starred'],['trash','🗑 Trash']];
const ext=n=>(n.split('.').pop()||'').toLowerCase();
const fi=i=>{const e=ext(i.name);return e=='pdf'?'📕':/xlsx?|csv/.test(e)?'📗':/docx?/.test(e)?'📘':/pptx?/.test(e)?'📙':/^image/.test(i.mime)?'🖼':'📄'};
const ico=i=>i.type=='project'?(i.icon||'📘'):i.type=='folder'?'📁':i.type=='meeting'?'👥':i.type=='plan'?(i.done?'☑':'☐'):i.type=='note'?'📝':i.type=='task'?(i.done?'☑':'☐'):fi(i);
const sz=b=>b>1e6?(b/1e6).toFixed(1)+' MB':Math.ceil(b/1e3)+' KB';
const meta=i=>{const p=i.parent&&get(i.parent);let s=isC(i)?[desc(i.id).filter(x=>!x.trashed).length+' items']:[i.type];if(i.type=='task')s=[i.status||'todo',i.priority||'medium',i.due?'📅 '+i.due+(i.time?' ⏰ '+i.time:''):'no due date'];if(i.type=='meeting')s=['📅 '+i.date+(i.time?' ⏰ '+i.time:''),i.place].filter(Boolean);if(i.type=='plan')s=['🗓 '+i.date+(i.time?' ⏰ '+i.time:'')];if(i.type=='file')s.push(sz(i.size));if(p)s.push('in '+p.name);s.push(new Date(i.updated).toLocaleDateString());return esc(s.join(' · '))};

 else if(act=='edesc'){const n=await dlg({title:'Description',msg:i.name,label:'Description',input:i.desc||'',area:1,empty:1,icon:'📝',ok:'Save'});if(n!==null){i.desc=n;await save(i)}}
 else if(act=='savem'){const g=s=>$('#'+s)?.value||'';Object.assign(ed,{name:g('fn').trim()||'Untitled',date:g('fd')||TD(),time:g('ft'),place:g('fp'),people:g('fg'),agenda:g('fa'),notes:g('fo')});if($('#tl'))ed.parent=$('#tl').value||null;await save(ed);close();return}
 else if(act=='pick'){$('#fi').click();return}
 else if(act=='tgl'){i.done=!i.done;i.status=i.done?'done':'todo';await save(i)}
 else if(act=='star'){i.starred=!i.starred;await save(i)}
 else if(act=='ren'){const n=await dlg({title:'Rename',label:'New name',input:i.name,icon:'✏️',ok:'Save'});if(n){i.name=n;await save(i)}}
 else if(act=='dl')dl(i);
 else if(act=='open'){if(isC(i))view={k:'folder',id:i.id};else if(i.type=='note'){noteM(i);return}else if(i.type=='task'){taskM(i);return}else if(i.type=='meeting'){meetM(i);return}else if(i.type=='plan'){planM(i);return}else if(!i.trashed){prev(i);return}}
 else if(act=='mv'){const ex=isC(i)?[i.id,...desc(i.id).map(x=>x.id)]:[];modal(`<b>Move “${esc(i.name)}”</b><select id=mt>${opts(i.parent,ex)}</select><button class=pr data-a=domv data-id=${i.id}>Move</button><button data-a=close>Cancel</button>`);return}
 else if(act=='domv'){const t=$('#mt').value||null;if(i.type=='project'&&t)return toast('Projects stay at top level.');i.parent=t;await save(i);$('#m').classList.remove('on')}
 else if(act=='del'||act=='res'){const on=act=='del';if(on&&!await dlg({title:'ពិតជាចង់លុបមែនទេ?',msg:'“'+(i.name||'Untitled')+'” នឹងត្រូវផ្លាស់ទៅ Trash ហើយអ្នកអាចស្ដារវិញបាន។',icon:'🗑',danger:1,ok:'លុប'}))return;for(const x of [i,...desc(i.id)]){x.trashed=on;await save(x)}}
 else if(act=='kill'){if(await dlg({title:'Delete forever?',msg:'This cannot be undone.',icon:'🗑',danger:1,ok:'Delete'}))for(const x of [i,...desc(i.id)]){items=items.filter(y=>y!==x);await tx('readwrite',s=>s.delete(x.id))}}
 else if(act=='savet'){ed.name=$('#tn').value.trim()||'Untitled task';ed.status=$('#ts').value;ed.priority=$('#tp').value;ed.due=$('#td').value;ed.time=$('#tt').value;ed.desc=$('#tdd').value;ed.done=ed.status=='done';ed.parent=$('#tl').value||null;await save(ed);close();return}
 else if(act=='close'){close();return}
 render()});
document.addEventListener('input',e=>{if(e.target.id=='pn'||e.target.id=='pd'){pvu();return}if(!ed||ed.type!='note')return;if(e.target.id=='nt'||e.target.id=='ne'){ed.name=$('#nt').value;ed.html=$('#ne').innerHTML;ed.text=$('#ne').innerText;save(ed)}});
document.addEventListener('change',e=>{if(e.target.id=='np'&&ed){ed.parent=e.target.value||null;save(ed)}});
document.addEventListener('paste',e=>{if(e.target.id=='ne'){e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'))}});
$('#fi').onchange=e=>{upload(e.target.files);e.target.value=''};
$('#q').oninput=e=>{q=e.target.value.trim();render()};
document.addEventListener('change',e=>{if(e.target.id=='pg'&&pv_.doc){pv_.n=Math.min(pv_.doc.numPages,Math.max(1,+e.target.value||1));pdraw()}});
document.addEventListener('keydown',e=>{if(!pv_.doc||e.target.tagName=='INPUT')return;const k=e.key;if(k=='ArrowRight'||k=='PageDown'||k=='ArrowDown'){e.preventDefault();pv_.n=Math.min(pv_.doc.numPages,pv_.n+1);pdraw()}else if(k=='ArrowLeft'||k=='PageUp'||k=='ArrowUp'){e.preventDefault();pv_.n=Math.max(1,pv_.n-1);pdraw()}});
addEventListener('resize',()=>pdraw());document.addEventListener('fullscreenchange',()=>setTimeout(pdraw,80));
addEventListener('online',stor);addEventListener('offline',stor);
DB.then(()=>tx('readonly',s=>s.getAll())).then(r=>{items=r||[];render()}).catch(e=>{$('#main').innerHTML='<div class=empty>Could not open local database: '+esc(e)+'</div>'});
setInterval(()=>{if(!q&&!$('#m').classList.contains('on')&&!$('#d').classList.contains('on'))render()},6e4);
</script></body></html>
